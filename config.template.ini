# Stock Market Screener and Analysis System - Configuration Template
# Copy this file to .env or edit settings below

[DATA_FEED]
DEFAULT_MODE = MOCK  # Options: MOCK, ANGEL_ONE, FYERS

[ANGEL_ONE]
ANGEL_API_KEY = your_angel_one_api_key_here
ANGEL_CLIENT_CODE = your_angel_client_code_here
ANGEL_PASSWORD = your_angel_password_here
ANGEL_TOTP_SECRET = your_totp_secret_here

[FYERS]
FYERS_CLIENT_ID = your_fyers_client_id_here
FYERS_SECRET_KEY = your_fyers_secret_key_here
FYERS_ACCESS_TOKEN = your_fyers_access_token_here

[SCREENER]
MIN_LTP = 30.0
MAX_LTP = 500.0
MIN_BID_QTY = 1000000
MIN_ASK_QTY = 1000000
